# Evolution-strategy NAS config: population + mutation/crossover over the same
# RHS search space. Same seed and scoring as the random-search variants so this
# is a controlled strategy comparison for the paper.
search:
  name: real_multisearch_64x64_evolution
  dataset: real_64x64_mimo
  cache: data/processed/mimo64_5000.npz
  output_dir: search_results/nas_study/evolution
  seed: 42

  strategy: evolution
  num_candidates: 12
  population: 8
  generations: 3

  halving: true
  budget_epochs: 6
  final_epochs: 20
  top_k: 3

  training:
    batch_size: 64
    lr: 0.001
    weight_decay: 0.0001
    optimizer: adam
    scheduler: cosine
    grad_clip: 1.0
    early_stop_patience: 6
    device: cpu
    torch_threads: 8

  loss:
    m_weight: 1.0
    rate_weight: 1.0

  score:
    alpha_rate: 1.0
    beta_similarity: 0.5
    gamma_latency: 0.05
    delta_params: 0.02
    epsilon_constraint: 0.0
