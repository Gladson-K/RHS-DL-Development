# Budget variant B8: deeper search rungs (2x budget, 2x final epochs).
# Same search space, seed and scoring as real_multisearch.yaml (B4) so the two
# runs form a controlled budget ablation for the paper.
search:
  name: real_multisearch_64x64_b8
  dataset: real_64x64_mimo
  cache: data/processed/mimo64_5000.npz
  output_dir: search_results/nas_study/random_b8
  seed: 42

  strategy: random
  num_candidates: 12
  population: 8
  generations: 2

  halving: true
  budget_epochs: 8
  final_epochs: 25
  top_k: 3

  training:
    batch_size: 64
    lr: 0.001
    weight_decay: 0.0001
    optimizer: adam
    scheduler: cosine
    grad_clip: 1.0
    early_stop_patience: 6
    device: cpu
    torch_threads: 8

  loss:
    m_weight: 1.0
    rate_weight: 1.0

  score:
    alpha_rate: 1.0
    beta_similarity: 0.5
    gamma_latency: 0.05
    delta_params: 0.02
    epsilon_constraint: 0.0
