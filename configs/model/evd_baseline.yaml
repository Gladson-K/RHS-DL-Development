model:
  name: evd_baseline
  family: classical_reference
  description: >
    Eigenvector / EVD beamforming reference ("JEV"). For each sample the
    effective channel is averaged over the L paths, the dominant right-singular
    vectors form the analog beamformer F, and the holographic amplitude mask is
    obtained by projecting the excitation E onto F and clipping to [0, 1].
  type: evd

  evd:
    # H_eff = mean_l H[:, :, :, l]  ->  [Nr, Nt]
    reduce_paths: mean
    # torch.linalg.svd based, batched over samples
    method: svd
    amplitude_fit:
      projection: real_inner_product
      clip: [0.0, 1.0]
    num_rf_streams_source: metadata.RFno

  reference:
    dataset: real_64x64_mimo
    metric: gp_rate_ratio
    # Empirically measured on 1000 held-out samples (5000-sample cache)
    reported:
      n_samples: 1000
      gp_rate_mean: 51.963
      evd_rate_mean: 45.945
      evd_over_gp_ratio: 0.868
      pearson_corr: 0.663
