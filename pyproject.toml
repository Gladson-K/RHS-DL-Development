[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holobeam-gen"
version = "0.1.0"
description = "Physics-aware deep learning for RHS holographic beamforming"
requires-python = ">=3.10,<3.13"

dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "h5py>=3.10",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "tqdm>=4.66",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "tensorboard>=2.16"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.10",
    "pre-commit>=3.7"
]

[project.scripts]
holobeam-generate = "scripts.generate_dataset:main"
holobeam-train = "scripts.train:main"
holobeam-evaluate = "scripts.evaluate:main"
holobeam-benchmark = "scripts.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]