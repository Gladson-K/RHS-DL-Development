name: NAS Research Search

on:
  workflow_dispatch:
    inputs:

      config:
        description: "NAS configuration"
        required: true
        default: "configs/nas/random.yaml"

      trials:
        description: "Number of trials"
        required: true
        default: "50"

jobs:

  search:

    runs-on: self-hosted

    steps:

      - uses: actions/checkout@v4

      - name: Run NAS
        run: |
          python scripts/search_nas.py \
            --config ${{ inputs.config }} \
            --trials ${{ inputs.trials }}

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: nas-results
          path: search_results/