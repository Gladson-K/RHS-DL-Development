name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install package
        run: |
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests scripts

      - name: Unit tests
        run: |
          pytest tests/unit -v

      - name: Model tests
        run: |
          pytest tests/model -v

      - name: NAS tests
        run: |
          pytest tests/nas -v

      - name: Integration smoke
        run: |
          pytest tests/integration -v